<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Seyon Touch</title>
    <style>
      /* Without this, html/body/#root have no defined height, so the app
         only grows as tall as its own content and leaves blank space
         above/below on any viewport taller than that — this is what
         forces it to actually fill the screen edge-to-edge. */
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      body { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
